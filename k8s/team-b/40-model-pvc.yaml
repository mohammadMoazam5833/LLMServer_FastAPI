# Model weights PVC — must bind on the GPU node (worker-g01).
# Fill with: ./scripts/k8s_copy_model_to_pvc.sh
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-model
  namespace: team-b
  labels:
    app.kubernetes.io/name: qwen-model
    app.kubernetes.io/part-of: llm-fastapi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 70Gi
---
# Temporary sleeper so WaitForFirstConsumer binds PVC on worker-g01.
# Delete after model copy finishes.
apiVersion: v1
kind: Pod
metadata:
  name: model-copy
  namespace: team-b
  labels:
    app.kubernetes.io/name: qwen-model
    app.kubernetes.io/part-of: llm-fastapi
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["worker-g01"]
  containers:
    - name: copy
      image: alpine:latest
      command: ["sh", "-c", "apk add --no-cache tar curl ca-certificates && sleep 36000"]
      volumeMounts:
        - name: model
          mountPath: /models
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
  volumes:
    - name: model
      persistentVolumeClaim:
        claimName: qwen-model
