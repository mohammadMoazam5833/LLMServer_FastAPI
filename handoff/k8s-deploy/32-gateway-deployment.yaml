apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: team-b
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: llm-fastapi
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  selector:
    app.kubernetes.io/name: llm-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: team-b
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: llm-fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: llm-fastapi
    spec:
      # imagePullSecrets:
      #   - name: llm-registry
      containers:
        - name: gateway
          image: llm_proxy:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: llm-gateway-config
            - secretRef:
                name: llm-gateway
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
