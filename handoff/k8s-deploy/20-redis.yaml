apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: team-b
  labels:
    app.kubernetes.io/name: llm-redis
    app.kubernetes.io/part-of: llm-fastapi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: team-b
  labels:
    app.kubernetes.io/name: llm-redis
    app.kubernetes.io/part-of: llm-fastapi
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: llm-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: team-b
  labels:
    app.kubernetes.io/name: llm-redis
    app.kubernetes.io/part-of: llm-fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-redis
        app.kubernetes.io/part-of: llm-fastapi
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
