# Optional overlay: move gateway to compose bridge (K8s-like Service DNS).
#
# Requires Compose v2.24+ (`!reset`) and docker→host connectivity OR
# vLLM/OCR also off host network. See docs/DOCKER_K8S_FA.md
#
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d gateway

services:
  gateway:
    network_mode: !reset null
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      VLLM_BASE_URL: http://host.docker.internal:8003/v1
      OCR_SERVICE_URL: http://host.docker.internal:8010/api/v1/ocr
    volumes:
      - ./scripts/docker_gateway_entrypoint.sh:/entrypoint.sh:ro
      - /var/run/postgresql:/var/run/postgresql
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
